name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            runner: macos-15
            xcode_arch: arm64
          - arch: Intel
            runner: macos-15-intel
            xcode_arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      # Xcode 26's asset compiler crashes on Icon Composer .icon packages on macOS 15 CI.
      # Exclude only the app icon; the package and all demo Swift sources still build normally.
      - name: Build demo app
        working-directory: Examples/Demo
        run: |
          xcodebuild \
            -project MacAppFoundationDemo.xcodeproj \
            -scheme MacAppFoundationDemo \
            -configuration Debug \
            -destination "platform=macOS,arch=${{ matrix.xcode_arch }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            EXCLUDED_SOURCE_FILE_NAMES=AppIcon.icon \
            build
